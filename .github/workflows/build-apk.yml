name: Build DeutschBangla Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Files
        run: |
          echo "Looking for project zip..."
          for f in *; do
            if file "$f" | grep -qi "zip"; then
              echo "Extracting $f..."
              unzip -o "$f"
            fi
          done
          # If unzipped into a subfolder, bring files to root
          if [ ! -f "settings.gradle.kts" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "settings.gradle.kts" -exec dirname {} \;)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              echo "Moving files from $SUBDIR to root"
              cp -r "$SUBDIR"/* .
            fi
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ./DeutschBangla.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeutschBangla-Duolingo-APK
          path: ./DeutschBangla.apk

      - name: Create Direct Release
        uses: softprops/action-gh-release@v2
        if: success()
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "DeutschBangla App v1.0.${{ github.run_number }}"
          body: "Direct APK download for Android phone. Tap **DeutschBangla.apk** below to download and install!"
          files: ./DeutschBangla.apk
