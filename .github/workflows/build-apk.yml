name: Build DeutschBangla Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Files
        run: |
          for f in *; do
            if file "$f" | grep -qi "zip"; then
              echo "Extracting $f..."
              unzip -o "$f"
            fi
          done
          if [ ! -f "settings.gradle.kts" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "settings.gradle.kts" -exec dirname {} \;)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              echo "Moving files from $SUBDIR to root"
              cp -r "$SUBDIR"/* .
            fi
          fi

      - name: Auto-Patch Compose Icons & Progress Bar
        run: |
          python3 -c "
          p = 'app/src/main/java/com/deutschbangla/duolingo/MainActivity.kt'
          with open(p, 'r') as f:
              c = f.read()
          c = c.replace('\"শেখা\" to Icons.Default.Home', '\"শেখা\" to \"🏠\"')
          c = c.replace('\"বর্ণমালা\" to Icons.Default.Translate', '\"বর্ণমালা\" to \"🔤\"')
          c = c.replace('\"লিডারবোর্ড\" to Icons.Default.EmojiEvents', '\"লিডারবোর্ড\" to \"🏆\"')
          c = c.replace('\"শপ\" to Icons.Default.Storefront', '\"শপ\" to \"🛒\"')
          c = c.replace('\"প্রোফাইল\" to Icons.Default.Person', '\"প্রোফাইল\" to \"👤\"')
          c = c.replace('icon = { Icon(pair.second, contentDescription = pair.first) }', 'icon = { Text(pair.second, fontSize = 20.sp) }')
          c = c.replace('Icon(Icons.Default.VolumeUp, contentDescription = \"Speak\", tint = DuoBlue)', 'Text(\"🔊\", fontSize = 24.sp)')
          c = c.replace('Icon(Icons.Default.Close, contentDescription = \"Close\")', 'Text(\"✕\", fontSize = 20.sp, fontWeight = FontWeight.Bold)')
          c = c.replace('progress = { (qIndex.toFloat()) / lesson.questions.size.coerceAtLeast(1) }', 'progress = (qIndex.toFloat()) / lesson.questions.size.coerceAtLeast(1)')
          with open(p, 'w') as f:
              f.write(c)
          "
          python3 -c "
          p = 'app/build.gradle.kts'
          with open(p, 'r') as f:
              c = f.read()
          c = c.replace('kotlinOptions {', 'kotlinOptions {\n        freeCompilerArgs += listOf(\"-opt-in=androidx.compose.material3.ExperimentalMaterial3Api\", \"-opt-in=androidx.compose.foundation.layout.ExperimentalLayoutApi\")')
          with open(p, 'w') as f:
              f.write(c)
          "

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ./DeutschBangla.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeutschBangla-Duolingo-APK
          path: ./DeutschBangla.apk

      - name: Create Direct Release
        uses: softprops/action-gh-release@v2
        if: success()
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "DeutschBangla App v1.0.${{ github.run_number }}"
          body: "Direct APK download for Android phone. Tap **DeutschBangla.apk** below to download and install!"
          files: ./DeutschBangla.apk
